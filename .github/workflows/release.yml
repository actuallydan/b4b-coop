# Release: on a v* tag, build the player package from this commit with the pinned toolchain (zig 0.15.2, MinHook
# 8af6b4a; tools/fetch-deps.sh checks both), then publish dist/b4bcoop.zip + SHA256SUMS as a GitHub release with a
# signed build provenance attestation. Verify a download: gh attestation verify b4bcoop.zip -R actuallydan/b4b-coop
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # OIDC token for the Sigstore signing certificate (attestation)
      attestations: write  # store the attestation
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned toolchain (zig 0.15.2 + MinHook)
        run: tools/fetch-deps.sh --build

      - name: Build the player package (native/build.sh --release)
        run: launch/package.sh

      - name: Check the player build has no dev code
        run: |
          dll=dist/b4bcoop/dwmapi.dll
          for s in "server: listening" "exec failed" "rewardtest" "steamjoin" "Dev_JoinPool"; do
            if grep -qaF -- "$s" "$dll"; then echo "::error::player build contains dev string '$s'"; exit 1; fi
          done
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/b4bcoop.zip
            dist/b4bcoop/dwmapi.dll

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Built by GitHub Actions from commit ${GITHUB_SHA} (tag ${TAG}), workflow \`.github/workflows/release.yml\`.

          Check your download:
          - \`sha256sum -c --ignore-missing SHA256SUMS\` next to the zip (Windows: \`Get-FileHash b4bcoop.zip\`, compare with the line below)
          - \`gh attestation verify b4bcoop.zip -R ${REPO}\` proves it was built by this repository's workflow.

          \`\`\`
          $(cat dist/SHA256SUMS)
          \`\`\`
          EOF
          gh release create "$TAG" dist/b4bcoop.zip dist/SHA256SUMS --repo "$REPO" --verify-tag \
            --title "b4b-coop $TAG" --notes-file notes.md
